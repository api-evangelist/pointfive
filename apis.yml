aid: pointfive
name: Pointfive
description: >-
  PointFive is the AI Efficiency Operating System for FinOps, platform, and
  engineering teams. It detects 500+ types of cloud, Kubernetes, and AI-infrastructure
  waste that traditional cost dashboards miss, then converts findings into auditable
  remediation — drafting pull requests and Jira tickets — and tracks realized savings
  back to actual budget impact. Marquee capabilities include DeepWaste Detection,
  DeepWaste for AI (model/GPU/data-platform spend), TokenShift (coding-agent token
  governance), and Agentic Remediation. Its public programmatic surface is an OAuth
  2.1 Model Context Protocol (MCP) server that brings cost intelligence into AI tools
  like Claude, Cursor, and ChatGPT. Surfaced as an Accel / Index Ventures portfolio
  company and enriched by the API Evangelist pipeline.
